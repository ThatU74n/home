# yaml-language-server: $schema=https://raw.githubusercontent.com/redhat-developer/vscode-tekton/refs/heads/main/scheme/tekton.dev/v1_PipelineRun.json
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pull-request-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && body.action in ["opened", "reopenend", "synchronize", "ready_for_review"]
      && !body.pull_request.draft
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"

  workspaces:
    - name: src
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox-csi-xfs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Mi
            limits:
              storage: 1Gi
    - name: dependency-cache
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox-csi-xfs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Mi
            limits:
              storage: 1Gi
    - name: ca-bundle
      configMap:
        name: internal-ca
        items:
          - key: internal-ca.crt
            path: ca-bundle.crt
  # work around to fix permission issue when git clone to a root volume
  taskRunSpecs:
    - pipelineTaskName: checkout
      podTemplate:
        securityContext:
          fsGroup: 65532

  pipelineSpec:
    displayName: Pull Request CI
    description: Lint Ansible, Terraform, K8s on Pull Request to main
    workspaces:
      - name: src
      - name: dependency-cache
      - name: ca-bundle
    tasks:
      - name: checkout
        displayName: Check out
        workspaces:
          - name: output
            workspace: src
          - name: ssl-ca-directory
            workspace: ca-bundle
        taskRef:
          resolver: hub
          params:
            - name: catalog
              value: git-clone
            - name: name
              value: git-clone
            - name: version
              value: 1.7.0
        params:
          - name: url
            value: "$(params.repo_url)"
          - name: revision
            value: "$(params.revision)"

      - name: diff
        displayName: Diff register
        runAfter:
          - checkout
        workspaces:
          - name: src
            workspace: src
        taskSpec:
          workspaces:
            - name: src
          results:
            - name: ansible
              type: string
            - name: k8s
              type: string
            - name: terraform
              type: string
          steps:
            - name: diff
              image: alpine/git:v2.54.0
              workingDir: "$(workspaces.src.path)"
              script: |
                #!/bin/sh
                set -eu

                register() {
                  if [ -n "$(git diff --name-only origin/main..HEAD -- ":(glob)$2")" ]; then
                    printf 'true' > "$1"
                  else
                    printf 'false' > "$1"
                  fi
                }

                git config --global --add safe.directory "$(workspaces.src.path)"

                register "$(results.ansible.path)" 'configuration/**'
                register "$(results.k8s.path)" 'k8s/**'
                register "$(results.terraform.path)" 'infrastructure/**'


      - name: k8s-lint
        displayName: K8s Lint
        runAfter:
          - diff
        when:
          - input: "$(tasks.diff.results.k8s)"
            operator: in
            values:
              - "true"
        workspaces:
          - name: src
            workspace: src
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: k8s-lint
            - name: namespace
              value: ci
        params:
          - name: path
            value: k8s/
          - name: yamllint-config-path
            value: .yamllint.yaml


