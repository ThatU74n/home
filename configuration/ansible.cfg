[defaults]
inventory = ./inventory
roles_path = ./roles
[inventory]
enable_plugins = community.proxmox.proxmox,amazon.aws.aws_ec2,yaml
use_extra_vars = true

ignore_patterns = aws_ec2.yaml,proxmox.yaml

[ssh_connection]
pipelining = true
ssh_args = -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s

