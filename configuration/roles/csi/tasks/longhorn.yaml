---
- name: Install Longhorn dependencies (Debian)
  become: true
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name: "{{ _longhorn_dependencies }}"
    state: present

- name: Install Longhorn dependencies (RedHat)
  become: true
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name: "{{ _longhorn_dependencies }}"
    state: present

- name: Enable and start iscsid
  become: true
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
