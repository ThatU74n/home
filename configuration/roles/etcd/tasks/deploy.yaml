---
# Stop other mode deployments
- name: Stop Etcd systemd deployment
  become: true
  when:
    - etcd_mode != "systemd"
    - "'etcd.service' in ansible_facts.services"
    - ansible_facts.services['etcd.service']['state'] in ['running', 'active']
  ansible.builtin.systemd:
    name: etcd
    state: stopped

- name: Stop Etcd static pod deployment
  become: true
  when:
    - etcd_mode != "staticpod"
  ansible.builtin.file:
    name: "{{ etcd_static_pod_dir }}/etcd.yaml"
    state: absent

# Start the deployment for the selected mode
- name: Start Etcd systemd deployment
  become: true
  when: etcd_mode == "systemd"
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true

- name: Start Etcd static pod deployment
  become: true
  when:
    - etcd_mode == "staticpod"
    - not _etcd_is_config_lock or not _etcd_static_pod_file.stat.exists
  ansible.builtin.template:
    src: etcd.yaml.jinja
    dest: "{{ etcd_static_pod_dir }}/etcd.yaml"
    owner: root
    group: root
    mode: "0644"
