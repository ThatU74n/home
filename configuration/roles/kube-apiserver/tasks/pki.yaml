---
# Fetch CA cert
- name: Write CAs
  become: true
  no_log: true
  loop_control:
    loop_var: ca_item
  loop:
    - dest: "{{ kube_apiserver_pki_dir }}/ca.crt"
      content: "{{ kube_apiserver_ca_cert_content }}"
    - dest: "{{ kube_apiserver_etcd_pki_dir }}/ca.crt"
      content: "{{ kube_apiserver_etcd_ca_cert_content }}"
  ansible.builtin.copy:
    dest: "{{ ca_item.dest }}"
    content: "{{ ca_item.content }}"
    owner: root
    group: root
    mode: "0644"

# Kube apiserver key - cert
- name: Generate Kube-apiserver key
  become: true
  register: _kube_apiserver_key
  community.crypto.openssl_privatekey:
    path: "{{ kube_apiserver_pki_dir }}/apiserver.key"
    size: 2048

- name: Generate CSR for Kube-apiserver
  become: true
  register: _kube_apiserver_csr
  changed_when: _kube_apiserver_key.changed
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ kube_apiserver_pki_dir }}/apiserver.key"
    common_name: system:kube-apiserver
    subject_alt_name: "{{ _kube_apiserver_apiserver_san }}"

- name: Sign Kube-apiserver certificate
  become: true
  community.crypto.x509_certificate:
    path: "{{ kube_apiserver_pki_dir }}/apiserver.crt"
    csr_content: "{{ _kube_apiserver_csr.csr }}"
    provider: ownca
    ownca_content: "{{ kube_apiserver_ca_cert_content }}"
    ownca_privatekey_content: "{{ kube_apiserver_ca_key_content }}"

# Kube apiserver - Etcd key - cert
- name: Generate Etcd client key
  become: true
  register: _kube_apiserver_etcd_client_key
  community.crypto.openssl_privatekey:
    path: "{{ kube_apiserver_pki_dir }}/apiserver-etcd-client.key"
    size: 2048

- name: Generate CSR for Etcd client
  become: true
  register: _kube_apiserver_etcd_client_csr
  changed_when: _kube_apiserver_etcd_client_key.changed
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ kube_apiserver_pki_dir }}/apiserver-etcd-client.key"
    common_name: "kube-apiserver-etcd-client"

- name: Sign Etcd client certificate
  become: true
  community.crypto.x509_certificate:
    path: "{{ kube_apiserver_pki_dir }}/apiserver-etcd-client.crt"
    csr_content: "{{ _kube_apiserver_etcd_client_csr.csr }}"
    provider: ownca
    ownca_content: "{{ kube_apiserver_etcd_ca_cert_content }}"
    ownca_privatekey_content: "{{ kube_apiserver_etcd_ca_key_content }}"

# Kube apiserver - Kubelet key - cert
- name: Generate Kubelet client key
  become: true
  register: _kube_apiserver_kubelet_client_key
  community.crypto.openssl_privatekey:
    path: "{{ kube_apiserver_pki_dir }}/apiserver-kubelet-client.key"
    size: 2048

- name: Generate CSR for Kubelet client
  become: true
  register: _kube_apiserver_kubelet_client_csr
  changed_when: _kube_apiserver_kubelet_client_key.changed
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ kube_apiserver_pki_dir }}/apiserver-kubelet-client.key"
    common_name: "kube-apiserver-kubelet-client"
    organization_name: "system:masters"

- name: Sign Kubelet client certificate
  become: true
  community.crypto.x509_certificate:
    path: "{{ kube_apiserver_pki_dir }}/apiserver-kubelet-client.crt"
    csr_content: "{{ _kube_apiserver_kubelet_client_csr.csr }}"
    provider: ownca
    ownca_content: "{{ kube_apiserver_ca_cert_content }}"
    ownca_privatekey_content: "{{ kube_apiserver_ca_key_content }}"

# Front proxy client key - cert

# Service account key - cert
# One per cluster
- name: Ensure PKI directory exists on the first control plane node
  become: true
  run_once: true
  delegate_to: "{{ groups['control_plane'] | sort | first }}"
  ansible.builtin.file:
    path: "{{ kube_apiserver_pki_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate Service account key
  become: true
  run_once: true
  delegate_to: "{{ groups['control_plane'] | sort | first }}"
  community.crypto.openssl_privatekey:
    path: "{{ kube_apiserver_pki_dir }}/service-account.key"
    size: 2048

- name: Generate Service account public key
  become: true
  run_once: true
  delegate_to: "{{ groups['control_plane'] | sort | first }}"
  community.crypto.openssl_publickey:
    path: "{{ kube_apiserver_pki_dir }}/service-account.pub"
    privatekey_path: "{{ kube_apiserver_pki_dir }}/service-account.key"

- name: Fetch Service account key pair to controller
  become: true
  run_once: true
  delegate_to: "{{ groups['control_plane'] | sort | first }}"
  loop:
    - service-account.key
    - service-account.pub
  ansible.builtin.fetch:
    src: "{{ kube_apiserver_pki_dir }}/{{ item }}"
    dest: /tmp/sa-pki/
    flat: true

- name: Push Service account key pair to other control plane nodes
  become: true
  when:
    - inventory_hostname != (groups['control_plane'] | sort | first)
    - groups['control_plane'] | length > 1
  loop:
    - service-account.key
    - service-account.pub
  ansible.builtin.copy:
    src: "/tmp/sa-pki/{{ item }}"
    dest: "{{ kube_apiserver_pki_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
