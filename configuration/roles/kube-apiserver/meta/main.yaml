---
galaxy_info:
  author: "U74n"
  description: "Role to install and configure Kubernetes API server"
  license: "MIT"
  min_ansible_version: "2.20"
argument_specs:
  main:
    author: "U74n"
    description:
      - "Install and configure Kubernetes API server standalone or as part of a cluster"
      - "The API server is the central component of the Kubernetes control plane, exposing the Kubernetes API"
      - "You can supply your own PKI key pairs as variables, or let the role provision them"
      - ""
      - " * Documentation: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver"
    short_description: "Install and configure Kubernetes API server"
    options:
      kube_apiserver_version:
        type: str
        description:
          - "Kubernetes API server version to install"
          - "It is recommended to use the same version as the other components in the cluster"
          - "See https://kubernetes.io/releases for details"
        required: true

      kube_apiserver_mode:
        type: str
        description:
          - "Kubernetes API server deployment mode. Deploy the API server as:"
          - " - systemd      # deploy as a systemd service"
          - " - staticpod    # deploy as a static pod (requires Kubelet)"
          - "Defaults to staticpod when omitted"
        choices:
          - systemd
          - staticpod
        required: false
        default: staticpod

      kube_apiserver_installation_dir:
        type: path
        description:
          - "Directory to install the Kubernetes API server binary"
          - "Only applicable to systemd deployment mode"
          - "Defaults to /usr/local/kubernetes when omitted"
        required: false
        default: /usr/local/kubernetes

      kube_apiserver_static_pod_dir:
        type: path
        description:
          - "Directory to store the Kubernetes API server static pod manifest"
          - "Only applicable to staticpod deployment mode"
          - "Defaults to /etc/kubernetes/manifests when omitted"
        required: false
        default: /etc/kubernetes/manifests

      kube_apiserver_pki_dir:
        type: path
        description:
          - "Directory to store Kubernetes API server PKI files, including:"
          - " - Server certificate and key"
          - " - Etcd client certificate and key"
          - " - Kubelet client certificate and key"
          - " - Service account public and private key"
          - " - Front proxy client certificate and key"
          - "Defaults to /etc/kubernetes/pki when omitted"
        required: false
        default: /etc/kubernetes/pki

      kube_apiserver_etcd_pki_dir:
        type: path
        description:
          - "Directory of etcd PKI files on the target node"
          - "Used to locate the etcd CA certificate for signing the etcd client certificate"
          - "Defaults to /etc/etcd/pki when omitted"
        required: false
        default: /etc/etcd/pki

      kube_apiserver_ca_cert_content:
        type: str
        description:
          - "Kubernetes CA certificate content"
          - "If not provided, it will generate a new CA certificate"
        required: false

      kube_apiserver_ca_key_content:
        type: str
        description:
          - "Kubernetes CA private key content"
          - "If not provided, it will generate a new CA key"
        required: false

      kube_apiserver_etcd_ca_cert_content:
        type: str
        description:
          - "Etcd CA certificate content"
          - "If not provided, it will generate a new CA certificate"
        required: false

      kube_apiserver_etcd_ca_key_content:
        type: str
        description:
          - "Etcd CA private key content"
          - "If not provided, it will generate a new CA key"
        required: false

      kube_apiserver_storage_backend:
        type: str
        description:
          - "Storage backend for the Kubernetes API server"
          - "Defaults to etcd3 when omitted"
        choices:
          - etcd2
          - etcd3
        required: false
        default: etcd3
