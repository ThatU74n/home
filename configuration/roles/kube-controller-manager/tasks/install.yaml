---
- name: Ensure Kubernetes directory
  become: true
  loop_control:
    loop_var: kubernetes_dir
  loop:
    - "{{ kube_controller_manager_installation_dir if kube_controller_manager_mode == 'systemd' else omit }}"
    - "{{ kube_controller_manager_pki_dir }}"
    - "{{ kube_controller_manager_static_pod_dir if kube_controller_manager_mode == 'staticpod' else omit }}"
  ansible.builtin.file:
    path: "{{ kubernetes_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kube-controller-manager binary
  become: true
  when: kube_controller_manager_mode == "systemd"
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/v{{ kube_controller_manager_version }}/bin/linux/amd64/kube-controller-manager"
    dest: "{{ kube_controller_manager_installation_dir }}/kube-controller-manager-{{ kube_controller_manager_version }}"
    checksum: "sha256:{{ kube_controller_manager_checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Symlink Kube-controller-manager binary
  become: true
  when: kube_controller_manager_mode == "systemd"
  notify:
    - Restart Kube-controller-manager
  ansible.builtin.file:
    src: "{{ kube_controller_manager_installation_dir }}/kube-controller-manager-{{ kube_controller_manager_version }}"
    dest: /usr/local/bin/kube-controller-manager
    state: link
