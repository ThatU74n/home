---
- name: Install dependencies
  become: true
  ansible.builtin.package:
    name: "{{ _kube_controller_manager_dependencies }}"
    state: present

# Set Kubernetes CA key, if not found create one at the first control plane
- name: Set Kubernetes CA key
  when: kube_controller_manager_ca_key_content is not truthy
  run_once: true
  ansible.builtin.include_tasks:
    file: util/slurp_or_create_ca_key.yaml
  vars:
    task_delegate_to: "{{ groups['control_plane'] | sort | first }}"
    path: "{{ kube_controller_manager_pki_dir }}/ca.key"
    variable: kube_controller_manager_ca_key_content

# Set Kubernetes CA certificate, if not found create one at the first control plane
- name: Set Kubernetes CA certificate
  when: kube_controller_manager_ca_cert_content is not truthy
  run_once: true
  ansible.builtin.include_tasks:
    file: util/slurp_or_create_ca_cert.yaml
  vars:
    task_delegate_to: "{{ groups['control_plane'] | sort | first }}"
    path: "{{ kube_controller_manager_pki_dir }}/ca.crt"
    variable: kube_controller_manager_ca_cert_content
    ca_key_content: "{{ kube_controller_manager_ca_key_content }}"
    ca_common_name: Kubernetes CA

# Check Service account key
- name: Register Service account key
  become: true
  register: _kube_controller_manager_sa_key_stat
  ansible.builtin.stat:
    path: "{{ kube_controller_manager_pki_dir }}/service-account.key"

- name: Assert Service account key exists
  ansible.builtin.assert:
    that: _kube_controller_manager_sa_key_stat.stat.exists
    fail_msg: >-
      Service account private key not found at {{ kube_controller_manager_pki_dir }}/service-account.key.
      Please run the kube-apiserver role to generate the keys.

# Check Kube-controller-manager checksum
- name: Register Kube-controller-manager checksum
  when:
    - kube_controller_manager_mode == "systemd"
    - not kube_controller_manager_checksum
  block:
    - name: Fetch Kube-controller-manager checksum
      changed_when: false
      register: _kube_controller_manager_checksum_result
      ansible.builtin.uri:
        url: "https://dl.k8s.io/v{{ kube_controller_manager_version }}/bin/linux/amd64/kube-controller-manager.sha256"
        return_content: true

    - name: Set Kube-controller-manager checksum fact
      ansible.builtin.set_fact:
        kube_controller_manager_checksum: "{{ _kube_controller_manager_checksum_result.content }}"

# Gather service facts
- name: Gather service facts
  become: true
  ansible.builtin.service_facts:

# Ensure kube_controller_manager_installation_dir is correctly set
- name: Assert kube_controller_manager_installation_dir is correctly set
  when:
    - kube_controller_manager_mode == 'systemd'
    - _kube_controller_manager_is_installation_dir_blank
  ansible.builtin.fail:
    msg: "kube_controller_manager_installation_dir is required when deployment mode is systemd."

# Ensure kube_controller_manager_static_pod_dir is correctly set
- name: Assert kube_controller_manager_static_pod_dir is correctly set
  when:
    - kube_controller_manager_mode == 'staticpod'
    - _kube_controller_manager_is_static_pod_dir_blank
  ansible.builtin.fail:
    msg: "kube_controller_manager_static_pod_dir is required when deployment mode is staticpod."
