---
_kube_controller_manager_dependencies:
  - "{{ 'python3-cryptography' if ansible_facts['os_family'] != 'ArchLinux' else 'python-cryptography' }}"

_kube_controller_manager_flags: |
  --bind-address=0.0.0.0
  --cluster-cidr=10.0.0.0/8
  --cluster-name=kubernetes
  --service-cluster-ip-range=10.32.0.0/24
  --use-service-account-credentials=true
  --leader-elect=true
  --kubeconfig=/etc/kubernetes/controller-manager.conf
  --cluster-signing-cert-file={{ kube_controller_manager_pki_dir }}/ca.crt
  --cluster-signing-key-file={{ kube_controller_manager_pki_dir }}/ca.key
  --root-ca-file={{ kube_controller_manager_pki_dir }}/ca.crt
  --service-account-private-key-file={{ kube_controller_manager_pki_dir }}/service-account.key
  --v=2

_kube_controller_manager_systemd_flags: "{{ _kube_controller_manager_flags.splitlines() | join(' ') }}"
_kube_controller_manager_static_pod_flags: |-
  {% for flag in _kube_controller_manager_flags.splitlines() %}
  - {{ flag }}
  {% endfor %}

_kube_controller_manager_is_installation_dir_blank: "{{ kube_controller_manager_installation_dir is not truthy }}"
_kube_controller_manager_is_static_pod_dir_blank: "{{ kube_controller_manager_static_pod_dir is not truthy }}"
