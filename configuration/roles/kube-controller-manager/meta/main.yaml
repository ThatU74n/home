---
galaxy_info:
  author: "U74n"
  description: "Role to install and configure Kubernetes controller manager"
  license: "MIT"
  min_ansible_version: "2.20"
argument_specs:
  main:
    author: "U74n"
    description:
      - "Install and configure Kubernetes controller manager standalone or as part of a cluster"
      - "Kubernetes controller manager is a daemon that embeds the core control loops"
      - "A control loop is a non-termination loop that regulates the state of the system"
      - "You can supply your own PKI key pairs as variables, or let the role provision them"
      -
      - " * Documentation: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager"
    short_description: "Install and configure Kubernetes controller manager"
    options:
      kube_controller_manager_version:
        type: str
        description:
          - "Kubenretes controller manager version to install"
          - "It is recommended to use the same version as the other components in the cluster"
          - "See https://kubernetes.io/releases for details"
        required: true

      kube_controller_manager_mode:
        type: str
        description:
          - "Kubernetes controller manager deployment mode. Deploy the controller manager as:"
          - " - systemd     # deploy as a systemd service"
          - " - staticpod   # deploy as a static pod (requires Kubelet)"
          - "Defaults to staticpod when omitted"
        choices:
          - systemd
          - staticpod
        required: false
        default: staticpod

      kube_controller_manager_installation_dir:
        type: path
        description:
          - "Directory to install the Kubernetes controller manager binary"
          - "Only applicable to systemd deployment mode"
          - "Defaults to /usr/local/kubernetes when omitted"
        required: false
        default: /usr/local/kubernetes

      kube_controller_manager_static_pod_dir:
        type: path
        description:
          - "Directory to store the Kubernetes controller manager static pod manifest"
          - "Only applicable to staticpod deployment mode"
          - "Defaults to /etc/kubernetes/manifests when omitted"
        required: false
        default: /etc/kubernetes/manifests

      kube_controller_manager_pki_dir:
        type: path
        description:
          - "Directory to store Kubernetes controller manager PKI files including:"
          - " - controller manager certificate and key"
          - " - CA certificate and key for cluster signing function"
          - "Defaults to /etc/kubernetes/pki when omitted"
        required: false
        default: /etc/kubernetes/pki

      kube_controller_manager_ca_cert_content:
        type: str
        description:
          - "Kubernetes CA certificate content"
          - "If not provided, it will generate a new CA certificate"
        required: false

      kube_controller_manager_ca_key_content:
        type: str
        description:
          - "Kubernetes CA private key content"
          - "If not provided, it will generate a new CA key"
        required: false
