---
- name: Add Tailscale repository
  become: true
  notify: Update dnf cache
  ansible.builtin.yum_repository:
    name: tailscale
    description: Tailscale - stable
    baseurl: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/"
    enabled: true
    gpgcheck: true
    gpgkey: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/repo.gpg"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install Tailscale
  become: true
  ansible.builtin.dnf:
    name: tailscale
    state: present
