---
- name: Check swap
  become: true
  ansible.builtin.command: swapon --show
  register: kubelet_swap_check
  changed_when: false
  failed_when: false

- name: Assert that swap is turned off
  become: true
  ansible.builtin.assert:
    that:
      - kubelet_swap_check.stdout == ''
    fail_msg: "Swap is enabled. Please turn off swap to ensure Kubelet functions properly."

# Set Kubernetes CA key, if not found create one at the first control plane
- name: Set Kubernetes CA key
  when: kubelet_ca_key_content is not truthy
  run_once: true
  ansible.builtin.include_tasks:
    file: util/slurp_or_create_ca_key.yaml
  vars:
    task_delegate_to: "{{ groups['control_plane'] | sort | first }}"
    path: "{{ kubelet_pki_dir }}/ca.key"
    variable: kubelet_ca_key_content

# Set Kubernetes CA certificate, if not found create one at the first control plane
- name: Set Kubernetes CA certificate
  when: kubelet_ca_cert_content is not truthy
  run_once: true
  ansible.builtin.include_tasks:
    file: util/slurp_or_create_ca_cert.yaml
  vars:
    task_delegate_to: "{{ groups['control_plane'] | sort | first }}"
    path: "{{ kubelet_pki_dir }}/ca.crt"
    variable: kubelet_ca_cert_content
    ca_key_content: "{{ kubelet_ca_key_content }}"
    ca_common_name: Kubernetes CA
