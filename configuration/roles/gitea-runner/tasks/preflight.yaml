---
- name: Set runner registration token
  when: gitea_runner_registration_token is not truthy
  register: _gitea_runner_token_res
  ansible.builtin.uri:
    url: "http://localhost:3000/api/v1/admin/runners/registration-token"
    method: GET
    headers:
      Authorization: "Basic {{ (gitea_runner_gitea_admin_user + ':' + gitea_runner_gitea_admin_password) | b64encode }}"

- name: Set runner registration token fact
  when:
    - gitea_runner_registration_token is not truthy
    - _gitea_runner_token_res is not skipped
    - _gitea_runner_token_res.status == 200
  ansible.builtin.set_fact:
    gitea_runner_registration_token: "{{ _gitea_runner_token_res.json.token }}"
