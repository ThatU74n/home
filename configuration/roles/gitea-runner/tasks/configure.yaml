---
- name: Copy Gitea runner config template
  notify:
    - Restart Gitea runner
  ansible.builtin.template:
    src: config.yaml.jinja
    dest: "{{ gitea_runner_project_src }}/config.yaml"
    mode: "0644"

- name: Copy Gitea runner template
  notify:
    - Restart Gitea runner
  ansible.builtin.template:
    src: compose.yaml.jinja
    dest: "{{ gitea_runner_project_src }}/compose.yaml"
    mode: "0644"
