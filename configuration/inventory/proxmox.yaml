---
plugin: community.proxmox.proxmox
url: https://192.168.10.11:8006
validate_certs: false
want_facts: true
include_containers: true

compose:
  ansible_host: (proxmox_ipconfig0 | default(proxmox_net0)).ip | split('/') | first

keyed_groups:
  - key: proxmox_tags_parsed
    separator: ""
groups:
  control_plane: "'control_plane' in (proxmox_tags_parsed | list)"
  worker: "'worker' in (proxmox_tags_parsed | list)"
