---
name: Ansible CI on pull request

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
    paths:
      - configuration/**

concurrency:
  group: ansible-ci-pr
  cancel-in-progress: true

jobs:
  ansible-lint:
    name: Ansible lint
    runs-on: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # - name: Set up Nix
      #   uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.0.6
      #   with:
      #     nix_path: nixpkgs=channel:nixos-unstable
      #
      # - name: Pre-build dev shell
      #   run: nix build --no-link .#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').default
      #
      # - name: Ansible-lint
      #   shell: 'nix develop -c bash -e {0}'
      #   run: |
      #     cd configuration && \
      #       ansible-lint .

      - name: Setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install python dependencies
        run: |
          pip install -r requirements.txt

      - name: Ansible-lint
        run: |
          cd configuration &&\
            ansible-lint .

