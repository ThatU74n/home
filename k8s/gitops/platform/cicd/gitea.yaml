# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  project: default
  sources:
    - repoURL: https://gitea.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    - repoURL: https://dl.gitea.com/charts/
      targetRevision: 12.7.0
      chart: gitea
      helm:
        valueFiles:
          - $src/k8s/platform/cicd/gitea/values.yaml

    - repoURL: https://gitea.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/cicd/gitea

  syncPolicy:
    automated:
      prune: true
      enabled: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNameSpace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m


