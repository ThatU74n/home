# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg
  sources:
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    # source
    - repoURL: https://cloudnative-pg.github.io/charts
      targetRevision: 0.29.0
      chart: cloudnative-pg
      helm:
        valueFiles:
          - $src/k8s/platform/database/cloud_native_pg/values.yaml

    # dependencies
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/database/cloud_native_pg/namespace

    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/database/cloud_native_pg/external_secret

    # resources
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/database/cloud_native_pg/cluster

    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/database/cloud_native_pg/database

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
