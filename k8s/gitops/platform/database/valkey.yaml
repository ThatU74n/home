# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  project: default
  sources:
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    - repoURL: https://valkey.io/valkey-helm/
      targetRevision: 0.11.0
      chart: valkey
      helm:
        valueFiles:
          - $src/k8s/platform/database/valkey/values.yaml

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
