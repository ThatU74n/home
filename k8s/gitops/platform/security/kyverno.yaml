# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  project: default
  sources:
    - repoURL: https://gitea.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    - repoURL: https://kyverno.github.io/kyverno/
      targetRevision: 3.8.2
      chart: kyverno
      helm:
        valueFiles:
          - $src/k8s/platform/security/kyverno/values.yaml

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

