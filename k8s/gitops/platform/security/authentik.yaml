# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  sources:
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    # source
    - repoURL: https://charts.goauthentik.io
      targetRevision: 2026.8.5
      chart: authentik
      helm:
        valueFiles:
          - $src/k8s/platform/security/authentik/values.yaml

    # dependencies
    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/security/authentik/namespace

    - repoURL: https://gitea.k8s.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/security/authentik/external_secret

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
