# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  project: default
  sources:
    - repoURL: https://gitea.u74n.internal/utan/home.git
      targetRevision: main
      ref: src

    - repoURL: quay.io/jetstack/charts
      targetRevision: v1.21.0
      chart: cert-manager
      helm:
        valueFiles:
          - $src/k8s/platform/security/cert-manager/values.yaml

    - repoURL: https://gitea.u74n.internal/utan/home.git
      targetRevision: main
      path: k8s/platform/security/cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

