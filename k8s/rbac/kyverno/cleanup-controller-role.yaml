# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0-standalone-strict/clusterrole-rbac-v1.json
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:cleanup-controller:controllers
rules:
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - list
      - delete
