---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ .Release.Name }}-prometheus"
  labels:
    app: prometheus 
spec:
  serviceName: "{{ .Release.Name }}-prometheus"
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus 
          image: "{{ .Values.prometheus.repository }}:{{ .Values.prometheus.tag }}"
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/config.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL 
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config 
          configMap:
            name: "{{ .Release.Name }}-prometheus-config"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: "{{ .Values.storageClass }}"
        accessModes: 
          - "ReadWriteOnce"
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service 
metadata:
  name: "{{ .Release.Name }}-prometheus"
  labels:
    app: prometheus 
spec:
  type: ClusterIP
  selector:
    app: prometheus 
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: v1 
kind: ConfigMap 
metadata:
  name: "{{ .Release.Name }}-prometheus-config"
  labels:
    app: prometheus 
data:
  config.yaml: |
    global:
      scrape_interval: 30s 

    scrape_configs:
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['{{ .Release.Name }}-node-exporter:9100']
      


