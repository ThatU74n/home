---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fullName" . }}
  namespace: {{ .Release.Namespace }}
data:
  config.ini: |
    {{- range $section, $values := .Values.trilium }}
    [{{ $section | title }}]
    {{- range $key, $val := $values }}
    {{ $key }}={{ $val }}
    {{- end }}
    {{- end }}
