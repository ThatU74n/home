---
{{- if .Values.gatewayAPI.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute 
metadata:
  name: {{ include "fullName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commonLabels" . | nindent 4 }}
    {{- if .Values.gatewayAPI.httpRoute.labels }}
    {{- toYaml .Values.gatewayAPI.httpRoute.labels | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayAPI.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.gatewayAPI.httpRoute.parentRefs }}
    {{- toYaml .Values.gatewayAPI.httpRoute.parentRefs | nindent  4 }}
    {{- else }}
    {{- fail "gatewayAPI.httpRoute.parentRefs is required" }}
    {{- end }}
  {{- with .Values.gatewayAPI.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "fullName" . }}
          port: {{ .Values.service.port }}
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end -}}


