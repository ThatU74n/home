apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
  namespace: tekton-operator
spec:
  targetNamespace: tekton
  profile: all
  # config pruner to clean up old runs
  # schedule clean up 8:00 AM every day
  # keep max 3 runs history
  pruner:
    disabled: false
    schedule: "0 8 * * *"
    resources:
      - taskrun
      - pipelinerun
    keep: 3
    prune-per-resource: true
  dashboard:
    readonly: true
    options:
      disabled: false
      configMaps: {}
      deployments: {}
      webhookConfigurationOptions: {}
  # config result to store run results
  # db use cnpq
  result:
    disabled: false
    is_external_db: true
    db_host: postgresql-cluster-rw.cnpg.svc.cluster.local
    db_port: 5432
    db_name: tektonresults
    db_secret_user_key: username
    db_secret_password_key: password
    db_enable_auto_migration: true
    db_sslmode: disable
  platforms:
    kubernetes:
      pipelinesAsCode:
        enable: true
        settings:
          application-name: Pipelines as Code CI
          # set dashboard url for gitea pr navigation
          # if need to switch to custom dashboard, use custom-console-url sets
          # tekton-dashboar-url is an integration for its ecosystemj
          tekton-dashboar-url: "https://tekton.k8s.u74n.internal"
          # add error log to the pr
          error-log-snippet: "true"
          error-log-snippet-number-of-lines: "20"
        options:
          deployments:
            pipelines-as-code-controller:
              metadata:
                labels:
                  internal-ca: "true"
            pipelines-as-code-watcher:
              metadata:
                labels:
                  internal-ca: "true"



