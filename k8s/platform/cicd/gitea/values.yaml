---
global:
  storageClass: proxmox-storage-zfs
  replicaCount: 1

service:
  http:
    type: ClusterIP
  ssh:
    annotations:
    type: ClusterIP

ingress:
  enabled: false

gatewayAPI:
  enabled: true
  core:
    httpRoute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: cilium-gw
          namespace: gateway
          sectionName: https
      hostnames:
        - gitea.k8s.u74n.internal

deployment:
  resources:
    request:
      cpu: 100m
      memory: 128Mi
    limit:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  size: 10Gi
  storageClass: proxmox-csi-xfs

valkey:
  enabled: false
postgresql-ha:
  enabled: false
postgresql:
  enabled: false


gitea:
  admin:
    existingSecret: gitea-admin-cred
    passwordMode: keepUpdated
  config:
    database:
      DB_TYPE: postgres
      HOST: postgresql-cluster-rw.database.svc.cluster.local:5432
      NAME: giteadb
      USER: gitea
      SSL_MODE: disable
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-db-cred
          key: password

