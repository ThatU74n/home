---
isCluserService: true
service:
  name: kube-dns
  clusterIP: 10.32.0.10
servers:
  - zones:
      - zone: .
    port: 53
    plugins:
      - name: errors

      - name: health
        configBlock: |-
          lameduck 5s

      - name: ready

      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
          ttl 30

      - name: prometheus
        parameters: :9153

      - name: forward
        parameters: . 192.168.10.1 1.1.1.1

      - name: cache
        parameters: 30

      - name: loop

      - name: reload

      - name: loadbalance
