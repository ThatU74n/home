# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.5-standalone-strict/service-v1.json
---
apiVersion: v1
kind: Service
metadata:
  name: acme-dns
  annotations:
    lbipam.cilium.io/ips: 192.168.10.46
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: acme-dns
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      protocol: TCP
