# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.5-standalone-strict/deployment.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-dns
  labels:
    app.kubernetes.io/name: acme-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acme-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acme-dns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: acme-dns
          image: joohoi/acme-dns:v2.0.2
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/acme-dns/config.cfg"
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: false
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: acme-dns-config
              mountPath: /etc/acme-dns
            - name: data
              mountPath: /var/lib/acme-dns
      volumes:
        - name: acme-dns-config
          configMap:
            name: acme-dns-config
        - name: data
          persistentVolumeClaim:
            claimName: acme-dns-data


