---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-ca
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        resources:
          - deployments
          - statefulsets
        operations:
          - CREATE
          - UPDATE

  matchConditions:
    - name: ca-configmap-exists
      expression: >-
        dyn(resource.List("v1", "configmaps", object.metadata.namespace).items).exists(cm, cm.metadata.name == "internal-ca")

    - name: workload-has-internal-ca-label
      expression: >-
        object.metadata.?labels['internal-ca'].orValue('') == 'true'

  variables:
    - name: containers
      expression: >-
        object.spec.template.spec.containers
    - name: initContainers
      expression: >-
        object.spec.template.spec.?initContainers.orValue([])
    - name: volumes
      expression: >-
        object.spec.template.spec.?volumes.orValue([])

  mutations:
    # Upsert ca bundle config map as a volume,
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                spec: Object.spec.template.spec{
                  volumes:
                    variables.volumes.exists(v, v.name == "ca-bundle")
                    ? variables.volumes
                    : variables.volumes + [
                      Object.spec.template.spec.volumes{
                        name: "ca-bundle",
                        configMap: Object.spec.template.spec.volumes.configMap{
                          name: "internal-ca"
                        }
                      }
                    ]
                }
              }
            }
          }

    # Mount the volume to /etc/ssl/certs/
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                spec: Object.spec.template.spec{
                  containers: variables.containers.map(c,
                    Object.spec.template.spec.containers{
                      name: c.name,
                      volumeMounts:
                        c.?volumeMounts.orValue([]).exists(v, v.name == "ca-bundle")
                        ? c.?volumeMounts.orValue([])
                        : c.?volumeMounts.orValue([]) + [
                          Object.spec.template.spec.containers.volumeMounts{
                            name: "ca-bundle",
                            mountPath: "/etc/ssl/certs/internal-ca.crt",
                            subPath: "internal-ca.crt",
                            readOnly: true
                          }
                        ]
                    }
                  ),
                  initContainers: variables.initContainers.map(c,
                    Object.spec.template.spec.initContainers{
                      name: c.name,
                      volumeMounts:
                        c.?volumeMounts.orValue([]).exists(v, v.name == "ca-bundle")
                        ? c.?volumeMounts.orValue([])
                        : c.?volumeMounts.orValue([]) + [
                          Object.spec.template.spec.initContainers.volumeMounts{
                            name: "ca-bundle",
                            mountPath: "/etc/ssl/certs/internal-ca.crt",
                            subPath: "internal-ca.crt",
                            readOnly: true
                          }
                        ]
                    }
                  )
                }
              }
            }
          }

