# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/policies.kyverno.io/generatingpolicy_v1.json
#
# Policy name: Apply restricted network policy
# Condition:
#   - Namespace that have label security.network-policy: restricted
# Action:
#   - Create a Cilium Network Policy that:
#       - Block all ingress and egress in Namespace
#       - Block all ingress and egress across other Namespaces
#       - Only allow egress to DNS
---
apiVersion: policies.kyverno.io
kind: GeneratingPolicy
metadata:
  name: apply-strict-network-policy
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
    objectSelector:
      matchLabels:
        security.network-policy: restricted
  variables:
    - name: targetNamespace
      expression: object.metadata.name
    - name: downstream
      expression: >
        [{
          "apiVersion": dyn("cilium.io/v2"),
          "kind": dyn("CiliumNetworkPolicy"),
          "metadata": dyn({
            "name": "default-strict-network-policy"
          }),
          "spec": dyn({
            "description": "",
            "endpointSelector": dyn({}),
            "ingress": dyn([]),
            "egress": dyn([{
              "toEndpoints": dyn([{
                "matchLabels": dyn({
                  "k8s:io.kubernetes.pod.namespace": kube-system,
                  "k8s:k8s-app": kube-dns
                })
              }]),
              "toPorts": dyn([{
                "ports": dyn([{
                  "port": "53",
                  "protocol": "ANY"
                }])
              }])
            }])
          })
        }]
  generate:
    - expression: >
        generator.Apply(
          variables.targetNamespace,
          variables.downstream
        )
