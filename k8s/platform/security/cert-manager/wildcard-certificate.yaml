# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/cert-manager.io/certificate_v1.json
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-wildcard
  namespace: cert-manager
spec:
  secretName: k8s-wildcard-tls
  issuerRef:
    name: step-ca
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.u74n.internal"
