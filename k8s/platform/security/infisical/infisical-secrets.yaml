# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: infisical-secrets
  finalizers:
    - external-secrets.io/finalizers
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: infisical-secrets
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ENCRYPTION_KEY: "{{ .encryption_key }}"
        AUTH_KEY: "{{ .auth_key }}"
  data:
    - remoteRef:
        key: /home/infisical/root/encryption_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: encryption_key
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: /home/infisical/root/auth_key
        metadataPolicy: None
      secretKey: auth_key
