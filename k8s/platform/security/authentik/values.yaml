---
authentik:
  postgresql:
    host: postgresql-cluster-rw.cnpg.svc.cluster.local
    port: 5432
    name: authentik
    user: authentik
  error_reporting:
    enabled: false
 
global:
  envFrom:
    - secretRef:
        name: authentik-db-cred     # AUTHENTIK_POSTGRESQL__PASSWORD 
    - secretRef:
        name: authentik-secret-key  # AUTHENTIK_SECRET_KEY
  
server:
  ingress:
    enabled: false
  route:
    main:
      enabled: true 
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway 
          name: cilium-gw
          namespace: gateway 
          sectionName: https
      hostnames:
        - auth.k8s.u74n.internal

postgresql:
  enabled: false 
geoip:
  enabled: false 
promeheus:
  rules:
    enabled: false 
  serviceMonitor:
    enabled: false
