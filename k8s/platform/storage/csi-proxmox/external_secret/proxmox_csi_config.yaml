# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/external-secrets.io/externalsecret_v1.json
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: proxmox-csi-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: proxmox-csi-config
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config.yaml: |
          clusters:
            - url: "{{ .url }}"
              insecure: true
              token_id: "{{ .tokenId }}"
              token_secret: "{{ .tokenSecret }}"
              region: Region-1
  data:
    - remoteRef:
        key: /home/proxmox/csi/url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: url
    - remoteRef:
        key: /home/proxmox/csi/token_id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: tokenId
    - remoteRef:
        key: /home/proxmox/csi/token_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
      secretKey: tokenSecret

