# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-cluster
  annotations:
    cnpg.io/reconciliationLoop: enabled
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  storage:
    size: 50Gi
    storageClass: proxmox-csi-xfs
    resizeInUseVolumes: true
  managed:
    roles:
      - connectionLimit: -1
        ensure: present
        inherit: true
        name: authentik
        superuser: false
        login: true
        passwordSecret:
          name: authentik-db-cred

      - connectionLimit: -1
        ensure: present
        inherit: true
        name: gitea
        superuser: false
        login: true
        passwordSecret:
          name: gitea-db-cred

      - connectionLimit: -1
        ensure: present
        inherit: true
        name: grafana
        superuser: false
        login: true
        passwordSecret:
          name: grafana-db-cred

      - connectionLimit: -1
        ensure: present
        inherit: true
        name: harbor
        superuser: false
        login: true
        passwordSecret:
          name: harbor-db-cred

      - connectionLimit: -1
        ensure: present
        inherit: true
        name: infisical
        superuser: false
        login: true
        passwordSecret:
          name: infisical-db-cred

      - connectionLimit: -1
        ensure: present
        inherit: true
        name: tekton
        superuser: false
        login: true
        passwordSecret:
          name: tekton-results-postgres
